# alembic.ini — конфигурация Alembic для Transport CRM
#
# ИСПОЛЬЗОВАНИЕ:
#   # Применить все ожидающие миграции (запускается автоматически в Dockerfile):
#   alembic upgrade head
#
#   # Создать новую миграцию (autogenerate сравнивает models.py с БД):
#   alembic revision --autogenerate -m "add_column_foo_to_bar"
#
#   # Посмотреть текущую версию:
#   alembic current
#
#   # История миграций:
#   alembic history --verbose
#
#   # Откатить последнюю миграцию:
#   alembic downgrade -1
#
# ВАЖНО: sqlalchemy.url здесь НЕ задаётся — он читается динамически
# из переменной окружения DATABASE_URL в alembic/env.py (иначе Docker
# не увидит продакшн-путь к файлу БД).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]
# Раскомментируй для автоформатирования сгенерированных файлов миграций:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
