<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Транспорт CRM</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      // Apply stored theme before first paint (default: light) so a saved
      // "dark" choice doesn't flash light on reload. Kept in sync with the
      // STORAGE_KEY/default logic in src/theme/ThemeContext.tsx.
      (function () {
        try {
          var t = localStorage.getItem("crm-theme");
          document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
